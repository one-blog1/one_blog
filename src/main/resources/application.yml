# 비밀값은 모두 환경변수 또는 저장소 루트의 .env로만 넣는다 (constitution III).
# .env 예시: .env.example
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: one-blog
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:one_blog}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 원격 DB(Crowfoot)가 쉬는 연결을 먼저 끊는다. 30초마다 확인 신호를 보내고 3분마다 새 연결로 바꾼다.
      keepalive-time: 30000
      max-lifetime: 180000
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 바꾼다 (constitution IV)
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # 한 파일 3MB 검사는 서비스가 한다(6.3). 여기는 요청 전체의 상한 (글 이미지 묶음 10MB 대비)
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    # 465 = 처음부터 SSL로 접속 (587 STARTTLS가 일부 네트워크에서 응답 대기 중 끊겨 465로 바꿈)
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET}
  verification:
    code-pepper: ${CODE_PEPPER}
  mail:
    mode: ${MAIL_MODE:smtp}       # smtp | log
  cookie:
    secure: ${COOKIE_SECURE:true}  # 로컬 http는 false
  blog:
    limit:
      public: ${BLOG_LIMIT_PUBLIC:3}    # 공개 + 일부 공개, 1~5 (BLG-10, D-52)
      private: ${BLOG_LIMIT_PRIVATE:5}  # 비공개
    # 블로그 주소로 쓸 수 없는 값 (6.5). 사이트 경로가 늘면 여기에 더한다
    reserved-slugs: main, admin, api, login, signup, search, blog, blogs, my, me, new, css, js, images, files, error, static, favicon, notice, settings, help
  file:
    storage-dir: ${FILE_STORAGE_DIR:./uploads}   # 업로드 파일 저장 폴더 (D-75). 저장소에 올리지 않음
  admin:
    # 처음 관리자 계정 (D-94). 둘 다 넣으면 서버가 시작하면서 한 번 만든다. 저장소에 올리지 않는다
    initial-login-id: ${ADMIN_LOGIN_ID:}
    initial-password: ${ADMIN_PASSWORD:}
