# 비밀값은 모두 환경변수 또는 저장소 루트의 .env로만 넣는다 (constitution III).
# .env 예시: .env.example
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: one-blog
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:one_blog}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 원격 DB(Crowfoot)가 쉬는 연결을 먼저 끊는다. 30초마다 확인 신호를 보내고 3분마다 새 연결로 바꾼다.
      keepalive-time: 30000
      max-lifetime: 180000
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 바꾼다 (constitution IV)
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    # 465 = 처음부터 SSL로 접속 (587 STARTTLS가 일부 네트워크에서 응답 대기 중 끊겨 465로 바꿈)
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET}
  verification:
    code-pepper: ${CODE_PEPPER}
  mail:
    mode: ${MAIL_MODE:smtp}       # smtp | log
  cookie:
    secure: ${COOKIE_SECURE:true}  # 로컬 http는 false
