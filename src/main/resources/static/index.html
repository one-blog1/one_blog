<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>

  <main class="wide">
    <section id="notice-strip" class="notice-strip hidden" aria-label="공지사항">
      <strong>공지</strong>
      <ul id="notice-links"></ul>
    </section>

    <form class="row search-row" action="/search" method="get" role="search">
      <input name="q" type="search" maxlength="20" placeholder="블로그, 글 제목, 태그, 닉네임 검색" aria-label="검색어">
      <button class="primary inline-button" type="submit">검색</button>
    </form>

    <section class="card" aria-labelledby="feed-title">
      <h1 id="feed-title">글 피드</h1>
      <div class="tabs" role="tablist" aria-label="피드">
        <button type="button" role="tab" data-tab="latest" aria-selected="true">최신 글</button>
        <button type="button" role="tab" data-tab="popular" aria-selected="false">인기 글</button>
        <button type="button" role="tab" data-tab="following" aria-selected="false" class="hidden">팔로우</button>
        <button type="button" role="tab" data-tab="subscriptions" aria-selected="false" class="hidden">구독</button>
      </div>
      <ul id="feed-list" class="post-list"></ul>
      <p id="feed-empty" class="hint hidden">아직 글이 없어요.</p>
      <nav id="feed-pagination" class="pagination" aria-label="피드 페이지"></nav>
    </section>

    <section class="card">
      <div class="list-header">
        <h1>블로그 둘러보기</h1>
        <a class="button-link" href="/blog-new.html">블로그 만들기</a>
      </div>

      <div class="list-controls">
        <div class="segmented" role="group" aria-label="정렬">
          <button type="button" data-sort="latest" aria-pressed="true">최신순</button>
          <button type="button" data-sort="popular" aria-pressed="false">인기순</button>
        </div>
        <label class="inline" for="page-size">한 페이지
          <select id="page-size">
            <option value="10">10개</option>
            <option value="20">20개</option>
            <option value="30">30개</option>
          </select>
        </label>
      </div>

      <p id="list-message" class="message" role="status"></p>
      <div id="blog-list" class="blog-grid"></div>
      <nav id="pagination" class="pagination" aria-label="페이지"></nav>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/blog-card.js"></script>
  <script src="/js/blog-list.js"></script>
  <script src="/js/notice-strip.js"></script>
  <script src="/js/pager.js"></script>
  <script src="/js/post-item.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
