<!doctype html>
<!-- 메인 공지 목록과 내용 (BRD-10, D-122). ?id가 있으면 내용, 없으면 종류별 목록. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공지사항 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <script src="/js/lib/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>
  <main class="wide">
    <!-- 목록: ?id가 없을 때. 종류 탭으로 거른다 (D-122) -->
    <section id="notice-list-view" class="card hidden">
      <p class="breadcrumb"><a href="/">메인</a> › 공지사항</p>
      <h1>공지사항</h1>
      <nav id="notice-kinds" class="tabs" role="tablist" aria-label="공지 종류">
        <button type="button" role="tab" data-kind="" aria-selected="true">전체</button>
        <button type="button" role="tab" data-kind="GENERAL" aria-selected="false">일반</button>
        <button type="button" role="tab" data-kind="UPDATE" aria-selected="false">업데이트</button>
        <button type="button" role="tab" data-kind="FIX" aria-selected="false">수정</button>
        <button type="button" role="tab" data-kind="MAINTENANCE" aria-selected="false">점검</button>
      </nav>
      <ul id="notice-items" class="notice-list"></ul>
      <p id="notice-empty" class="hint hidden">아직 공지가 없어요.</p>
      <nav id="notice-pagination" class="pagination" aria-label="페이지"></nav>
    </section>

    <!-- 내용: ?id=공지 번호 -->
    <article id="notice" class="card hidden">
      <p class="breadcrumb"><a href="/">메인</a> › <a href="/notice.html">공지사항</a></p>
      <p><span id="notice-kind" class="notice-kind"></span></p>
      <h1 id="notice-title"></h1>
      <p id="notice-meta" class="post-meta"></p>
      <!-- 서버가 마크다운을 HTML로 바꾸고 jsoup으로 거른 본문 (SEC-06) -->
      <div id="notice-body" class="post-body"></div>
      <p class="notice-back"><a id="notice-back" href="/notice.html">목록으로</a></p>
    </article>
    <section id="notice-missing" class="card hidden">
      <h1>공지를 찾을 수 없습니다</h1>
      <p><a href="/notice.html">공지 목록으로</a></p>
    </section>
  </main>
  <script src="/js/lib/api.js"></script>
  <script src="/js/lib/ui.js"></script>
  <script src="/js/lib/icons.js"></script>
  <script src="/js/lib/modal.js"></script>
  <script src="/js/lib/header.js"></script>
  <script src="/js/components/pager.js"></script>
  <script src="/js/pages/notice.js"></script>
</body>
</html>
