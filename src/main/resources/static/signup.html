<!doctype html>
<!-- 회원가입 화면. 이메일 인증 → 비밀번호 → 정보 입력 순서 (USR-01, USR-02). -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/lib/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>

  <main>
    <section class="card">
      <h1>회원가입</h1>
      <ol class="steps" aria-label="가입 단계">
        <li data-step="1" class="active">① 이메일 인증</li>
        <li data-step="2">② 비밀번호</li>
        <li data-step="3">③ 정보 입력</li>
      </ol>

      <!-- ① 이메일 인증 (USR-02) -->
      <form id="step-1" novalidate>
        <label for="email">이메일</label>
        <div class="row">
          <input id="email" name="email" type="email" autocomplete="email" required>
          <button id="send-code" class="secondary" type="button">인증번호 받기</button>
        </div>
        <p id="send-message" class="message" role="status"></p>

        <div id="code-area" class="hidden">
          <label for="code">인증번호 6자리</label>
          <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
          <p class="hint">메일로 받은 번호를 10분 안에 입력해 주세요. 5번 틀리면 다시 받아야 합니다.</p>
          <p id="code-message" class="message error" role="alert"></p>
          <button class="primary" type="submit">인증하기</button>
        </div>
      </form>

      <!-- ② 비밀번호 (SEC-02) -->
      <form id="step-2" class="hidden" novalidate>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="15" required>
        <p class="hint">8~15자, 영문·숫자·특수문자를 모두 포함하고 대소문자를 구분합니다.</p>

        <label for="password-confirm">비밀번호 확인</label>
        <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="15" required>

        <p id="password-message" class="message error" role="alert"></p>
        <button class="primary" type="submit">다음</button>
      </form>

      <!-- ③ 이름·닉네임·전화번호·동의 (USR-01, 4.6) -->
      <form id="step-3" class="hidden" novalidate>
        <label for="name">이름</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="50" required>
        <p class="hint">이름은 가입 후 바꿀 수 없습니다.</p>

        <label for="nickname">닉네임</label>
        <div class="row">
          <input id="nickname" name="nickname" type="text" maxlength="12" required>
          <button id="check-nickname" class="secondary" type="button">중복 확인</button>
        </div>
        <p id="nickname-message" class="message" role="status"></p>
        <p class="hint">2~12자의 한글, 영문, 숫자</p>

        <label for="phone">휴대전화 번호</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="010-1234-5678" required>

        <!-- 두 필수 동의를 모두 체크해야 가입 버튼이 눌린다. 서버도 SignupRequest의 @AssertTrue로 한 번 더 막는다 (4.6) -->
        <fieldset class="agree-box" aria-label="약관 동의">
          <label class="checkbox agree-all" for="agree-all">
            <input id="agree-all" type="checkbox">
            전체 동의
          </label>
          <div class="checkbox">
            <input id="agree-terms" name="agreeTerms" type="checkbox">
            <label for="agree-terms">[필수] 이용약관에 동의합니다</label>
            <a class="agree-view" href="/terms.html" target="_blank" rel="noopener">새 창으로</a>
          </div>
          <!-- 전문은 terms.html·privacy.html을 그대로 불러와 작은 상자에 스크롤로 보여 준다 (signup.js loadPolicy) -->
          <div id="terms-box" class="agree-scroll post-body" tabindex="0" role="region" aria-label="이용약관 전문">불러오는 중…</div>
          <div class="checkbox">
            <input id="agree-privacy" name="agreePrivacy" type="checkbox">
            <label for="agree-privacy">[필수] 개인정보 수집·이용에 동의합니다</label>
            <a class="agree-view" href="/privacy.html" target="_blank" rel="noopener">새 창으로</a>
          </div>
          <div id="privacy-box" class="agree-scroll post-body" tabindex="0" role="region" aria-label="개인정보 처리방침 전문">불러오는 중…</div>
        </fieldset>

        <p id="signup-message" class="message error" role="alert"></p>
        <button id="signup-submit" class="primary" type="submit" disabled>가입하기</button>
        <p id="signup-hint" class="hint">필수 항목에 모두 동의하면 가입할 수 있어요.</p>
      </form>
    </section>
  </main>

  <script src="/js/lib/api.js"></script>
  <script src="/js/lib/ui.js"></script>
  <script src="/js/lib/icons.js"></script>
  <script src="/js/lib/modal.js"></script>
  <script src="/js/lib/header.js"></script>
  <script src="/js/pages/signup.js"></script>
</body>
</html>
