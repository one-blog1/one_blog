<!doctype html>
<!-- 회원 로그인 화면. 로그인 유지, 사람 확인, 소셜 로그인(D-126), 비밀번호·이메일 찾기와 회원가입 링크 (USR-03). -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <script src="/js/lib/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>

  <main>
    <section class="card">
      <h1>로그인</h1>
      <p id="signup-done" class="message ok hidden">가입이 완료되었습니다. 로그인해 주세요.</p>
      <p id="reset-done" class="message ok hidden">비밀번호를 바꿨습니다. 새 비밀번호로 로그인해 주세요.</p>
      <p id="social-error" class="message error" role="alert"></p>

      <form id="login-form" novalidate>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label class="checkbox" for="remember-me">
          <input id="remember-me" name="rememberMe" type="checkbox">
          로그인 유지
        </label>
        <p class="hint">공용 PC에서는 체크하지 마세요. 체크하지 않으면 브라우저를 닫거나 30분 동안 활동이 없을 때 로그아웃됩니다.</p>

        <div id="captcha" class="captcha hidden"></div>
        <p id="login-message" class="message error" role="alert"></p>
        <button class="primary" type="submit">로그인</button>
      </form>
      <div data-social-login data-verb="로그인"></div>
      <p class="footer-links"><a href="/find-account.html">비밀번호 찾기</a> · <a href="/find-account.html#email">이메일 찾기</a></p>

      <p class="footer-links">아직 회원이 아니신가요? <a href="/signup.html">회원가입</a></p>
    </section>
  </main>

  <script src="/js/lib/api.js"></script>
  <script src="/js/lib/ui.js"></script>
  <script src="/js/lib/icons.js"></script>
  <script src="/js/lib/modal.js"></script>
  <script src="/js/lib/header.js"></script>
  <script src="/js/components/captcha.js"></script>
  <script src="/js/components/social-login.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
