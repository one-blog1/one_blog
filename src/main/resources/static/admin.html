<!doctype html>
<!-- 관리자 화면. 통계, 회원·블로그·글·댓글 관리, 신고 처리, 공지, 활동 기록 (ADM-01~07). -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <script src="/js/lib/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>
  <main class="wide">
    <section class="card">
      <h1>관리자</h1>
      <nav class="tabs" role="tablist" aria-label="관리 메뉴">
        <button type="button" role="tab" data-tab="stats" aria-selected="true">통계</button>
        <button type="button" role="tab" data-tab="users" aria-selected="false">회원</button>
        <button type="button" role="tab" data-tab="blogs" aria-selected="false">블로그</button>
        <button type="button" role="tab" data-tab="posts" aria-selected="false">글</button>
        <button type="button" role="tab" data-tab="comments" aria-selected="false">댓글</button>
        <button type="button" role="tab" data-tab="reports" aria-selected="false">신고</button>
        <button type="button" role="tab" data-tab="notices" aria-selected="false">공지</button>
        <button type="button" role="tab" data-tab="actions" aria-selected="false">활동 기록</button>
      </nav>
      <form id="search-form" class="row search-row hidden">
        <input id="search-input" type="text" placeholder="검색어">
        <button class="secondary" type="submit">찾기</button>
      </form>
      <!-- 공지 쓰기·고치기 (BRD-10, D-122). 목록의 [수정]을 누르면 이 칸에 채워지고 "수정 저장"으로 바뀐다 -->
      <form id="notice-form" class="notice-form hidden" novalidate>
        <p id="notice-editing" class="hint hidden" role="status"></p>
        <label for="notice-category">공지 종류</label>
        <select id="notice-category">
          <option value="GENERAL">일반</option>
          <option value="UPDATE">업데이트</option>
          <option value="FIX">수정</option>
          <option value="MAINTENANCE">점검</option>
        </select>
        <label for="notice-title">공지 제목</label>
        <input id="notice-title" type="text" maxlength="30">
        <label for="notice-content">공지 내용 (마크다운)</label>
        <textarea id="notice-content" rows="6"></textarea>
        <div class="row notice-form-actions">
          <button id="notice-submit" class="primary inline-button" type="submit">공지 올리기</button>
          <button id="notice-cancel" class="secondary inline-button hidden" type="button">취소</button>
        </div>
      </form>
      <p id="admin-message" class="message" role="status"></p>
      <div id="admin-content" class="admin-content"></div>
      <nav id="admin-pagination" class="pagination" aria-label="페이지"></nav>
    </section>
  </main>
  <script src="/js/lib/api.js"></script>
  <script src="/js/lib/ui.js"></script>
  <script src="/js/lib/icons.js"></script>
  <script src="/js/lib/modal.js"></script>
  <script src="/js/lib/header.js"></script>
  <script src="/js/components/pager.js"></script>
  <script src="/js/pages/admin/admin-reports.js"></script>
  <script src="/js/pages/admin/admin.js"></script>
</body>
</html>
