<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 공유 링크의 key가 다른 사이트로 넘어가지 않게 한다 (research R6) -->
  <meta name="referrer" content="no-referrer">
  <title>블로그 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>

  <main class="wide">
    <section id="blog-notice" class="card hidden">
      <h1 id="notice-title"></h1>
      <p id="notice-text" class="hint"></p>
      <p class="footer-links"><a href="/">블로그 둘러보기</a></p>
    </section>

    <section id="blog-home" class="card hidden">
      <img id="blog-cover" class="blog-hero" src="/images/blog-default.svg" alt="">
      <h1 id="blog-name"></h1>
      <p id="blog-meta" class="blog-meta"></p>
      <p id="blog-description" class="blog-description-full"></p>
      <ul id="blog-tags" class="tag-list"></ul>

      <div id="share-area" class="share-area hidden">
        <p class="hint">이 블로그는 일부 공개예요. 아래 링크를 받은 사람만 볼 수 있어요.</p>
        <div class="row">
          <input id="share-url" type="text" readonly aria-label="공유 링크">
          <button id="copy-share" class="secondary" type="button">링크 복사</button>
        </div>
        <p id="share-message" class="message ok" role="status"></p>
      </div>

      <div id="join-area" class="join-area hidden">
        <p id="join-text" class="hint"></p>
        <button id="join-button" class="primary inline-button hidden" type="button"></button>
        <button id="join-cancel" class="secondary hidden" type="button">신청 취소</button>
        <p id="join-message" class="message" role="status"></p>
      </div>

      <section id="manage-area" class="manage-area hidden" aria-labelledby="manage-title">
        <h2 id="manage-title">참여 신청 <span id="request-count" class="count"></span></h2>
        <ul id="request-list" class="request-list"></ul>
        <p id="request-empty" class="hint hidden">대기 중인 신청이 없어요.</p>
      </section>

      <section class="post-area" aria-labelledby="posts-title">
        <div class="list-header">
          <h2 id="posts-title">글</h2>
          <a id="write-link" class="button-link hidden" href="#">글쓰기</a>
        </div>
        <div id="category-area" class="category-area hidden">
          <div id="category-nav" class="segmented category-nav" role="group" aria-label="카테고리"></div>
          <button id="category-manage-toggle" class="link-button hidden" type="button">카테고리 관리</button>
        </div>
        <section id="category-manage" class="manage-area hidden" aria-labelledby="category-manage-title">
          <h3 id="category-manage-title">카테고리 관리</h3>
          <ul id="category-edit-list" class="request-list"></ul>
          <form id="category-form" class="row">
            <input id="category-name" type="text" maxlength="30" placeholder="새 카테고리 이름" aria-label="새 카테고리 이름">
            <button class="secondary" type="submit">추가</button>
          </form>
          <p id="category-message" class="message error" role="alert"></p>
        </section>
        <ul id="notice-list" class="post-list notices"></ul>
        <ul id="post-list" class="post-list"></ul>
        <p id="post-empty" class="hint hidden">아직 글이 없어요.</p>
        <div class="list-controls">
          <span></span>
          <label class="inline" for="post-size">한 페이지
            <select id="post-size">
              <option value="10">10개</option>
              <option value="20">20개</option>
              <option value="30">30개</option>
            </select>
          </label>
        </div>
        <nav id="post-pagination" class="pagination" aria-label="글 페이지"></nav>
      </section>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/blog-card.js"></script>
  <script src="/js/blog.js"></script>
  <script src="/js/blog-join.js"></script>
  <script src="/js/pager.js"></script>
  <script src="/js/post-item.js"></script>
  <script src="/js/blog-posts.js"></script>
  <script src="/js/blog-categories.js"></script>
</body>
</html>
