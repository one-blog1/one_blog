<!doctype html>
<!-- 내 블로그 관리 화면. 만든 블로그, 참여한 블로그, 구독한 블로그, 받은 위임 요청 (BLG-06, BLG-08). -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 블로그 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>

  <main class="wide">
    <section class="card">
      <div class="list-header">
        <h1>내 블로그</h1>
        <a class="button-link" href="/blog-new.html">블로그 만들기</a>
      </div>
      <p id="my-message" class="message" role="status"></p>

      <section id="transfer-area" class="manage-area hidden" aria-labelledby="transfer-title">
        <h2 id="transfer-title">받은 블로그장 위임 요청</h2>
        <ul id="transfer-list" class="request-list"></ul>
        <p id="transfer-message" class="message" role="status"></p>
      </section>

      <h2>내가 만든 블로그</h2>
      <div id="owned-list" class="blog-grid"></div>
      <p id="owned-empty" class="hint hidden">아직 만든 블로그가 없어요. <a href="/blog-new.html">블로그 만들기</a></p>

      <h2>참여한 블로그</h2>
      <div id="joined-list" class="blog-grid"></div>
      <p id="joined-empty" class="hint hidden">아직 참여한 블로그가 없어요. <a href="/">블로그 둘러보기</a></p>

      <h2>구독한 블로그</h2>
      <div id="subscribed-list" class="blog-grid"></div>
      <p id="subscribed-empty" class="hint hidden">아직 구독한 블로그가 없어요.</p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/blog-card.js"></script>
  <script src="/js/my-blogs.js"></script>
</body>
</html>
