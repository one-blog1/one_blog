<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 블로그 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>

  <main class="wide">
    <section class="card">
      <div class="list-header">
        <h1>내 블로그</h1>
        <a class="button-link" href="/blog-new.html">블로그 만들기</a>
      </div>
      <p id="my-message" class="message" role="status"></p>

      <h2>내가 만든 블로그</h2>
      <div id="owned-list" class="blog-grid"></div>
      <p id="owned-empty" class="hint hidden">아직 만든 블로그가 없어요. <a href="/blog-new.html">블로그 만들기</a></p>

      <h2>참여한 블로그</h2>
      <div id="joined-list" class="blog-grid"></div>
      <p id="joined-empty" class="hint hidden">아직 참여한 블로그가 없어요. <a href="/">블로그 둘러보기</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/blog-card.js"></script>
  <script src="/js/my-blogs.js"></script>
</body>
</html>
