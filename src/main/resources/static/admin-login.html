<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>
  <main>
    <section class="card">
      <h1>관리자 로그인</h1>
      <p class="hint">관리자 전용 아이디로 로그인합니다. 회원 계정은 <a href="/login.html">회원 로그인</a>을 이용하세요.</p>
      <form id="admin-login-form" novalidate>
        <label for="login-id">관리자 아이디</label>
        <input id="login-id" type="text" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div id="captcha" class="captcha hidden"></div>
        <p id="login-message" class="message error" role="alert"></p>
        <button class="primary" type="submit">로그인</button>
      </form>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/captcha.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
