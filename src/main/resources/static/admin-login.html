<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 - One Blog</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">One Blog</a>
    <nav id="header-user" aria-label="회원 메뉴"></nav>
  </header>
  <main>
    <section class="card">
      <h1>관리자 로그인</h1>
      <p class="hint">관리자 전용 아이디로 로그인합니다. 회원 계정은 <a href="/login.html">회원 로그인</a>을 이용하세요.</p>
      <form id="admin-login-form" novalidate>
        <label for="login-id">관리자 아이디</label>
        <input id="login-id" type="text" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p id="login-message" class="message error" role="alert"></p>
        <button class="primary" type="submit">로그인</button>
      </form>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script>
    // 관리자 로그인 (SEC-09, D-98). 인라인 스크립트는 이 화면 하나뿐이고 사용자 입력을 화면에 넣지 않는다
    document.getElementById('admin-login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('login-message');
      message.textContent = '';
      const result = await window.api.post('/api/auth/admin/login', {
        loginId: document.getElementById('login-id').value.trim(),
        password: document.getElementById('password').value
      }, { userAction: true });
      if (result.ok) {
        window.location.href = '/admin.html';
        return;
      }
      message.textContent = (result.data && result.data.message) || '로그인하지 못했습니다.';
    });
  </script>
</body>
</html>
