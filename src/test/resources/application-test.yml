# 테스트 DB (research R8). 테스트는 회원·인증 테이블을 비우므로 개발 DB(DB_NAME)와 다른 DB를 쓴다.
# .env의 TEST_DB_* 값을 쓰고, 없으면 localhost:3306/one_blog_test에 one_blog 계정으로 접속한다.
spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:one_blog_test}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${TEST_DB_USERNAME:one_blog}
    password: ${TEST_DB_PASSWORD:}
  flyway:
    clean-disabled: false

app:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
  verification:
    code-pepper: test-only-code-pepper
  privacy:
    hash-pepper: test-only-privacy-pepper
  mail:
    mode: log
  cookie:
    secure: false
  file:
    storage-dir: build/test-uploads
  scheduling:
    enabled: false
  # 통합 테스트는 같은 IP(127.0.0.1)로 수백 번 로그인하므로 요청 제한을 끈다. 제한 규칙은 RateLimiterTest가 따로 본다
  rate-limit:
    enabled: false
