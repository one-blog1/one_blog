# CI (D-117, 단계 나누기 D-140): 배포 단계마다 다른 검사를 둔다. 앞 단계는 빠르게, 비싼 검사는 합칠 때만.
#
# | 단계        | 언제                                          | job  | 하는 일                                                        |
# | 1 빠른 확인 | feature/**·hotfix/** push, 모든 PR            | unit | 단위 테스트(DB 없이) + 커버리지 보고서. PR merge의 필수 검사   |
# | 2 통합 확인 | develop·main push(= merge), 직접 실행         | full | 전체 테스트(MySQL) + E2E(브라우저로 핵심 흐름 7개) + 커버리지  |
# |             |                                               |      | + SonarQube 품질 게이트(push만) + jar·Docker 실행 확인         |
#
# - 테스트 이름 규칙: *IntegrationTest = 통합(MySQL 필요), *E2ETest = E2E(MySQL + Chromium), 둘 다 2단계에서만. 나머지 = 단위 (build.gradle.kts)
# - 스테이징 서버는 따로 없다. E2E가 테스트 안에서 서버와 DB를 잠깐 띄워 실제 브라우저로 누른다(CI 안의 일회용 스테이징)
# - SonarQube 서버는 Community라 PR 분석이 없다. 품질 게이트는 merge 뒤 develop·main에서 보고, 실패하면 CI 실패 → main이면 배포 안 됨.
#   고치는 커밋을 새 feature 브랜치로 다시 merge한다 (스펙 028)
# - 배포(deploy.yml)는 main push로 돈 이 workflow가 성공했을 때만 이어진다 = full 성공 (unit은 main push에서 건너뜀)
# - 비밀값은 SonarQube 단계의 SONAR_TOKEN·SONAR_HOST_URL(GitHub Secrets)뿐이다. 나머지 DB 계정·키는 이 작업에서만 쓰고 버리는 값이다.
name: CI

on:
  push:
    # 브랜치 규칙 (D-136): main(배포), develop(다음 버전 모음), feature/*(기능), hotfix/*(운영 버그)
    branches: [main, develop, 'feature/**', 'hotfix/**']
    # 문서·Claude 설정만 바뀐 push는 CI(와 그 뒤의 배포 확인)를 돌리지 않는다. 진행 중인 배포 CI가 취소되지 않게
    paths-ignore: ['**.md', '.claude/**', '.specify/**']
  pull_request:
  # 직접 실행: 아무 브랜치에서나 2단계(full)를 돌린다. SonarQube에는 올리지 않는다(develop 결과를 덮어쓰지 않게)
  workflow_dispatch:

# 같은 브랜치의 새 push는 앞 실행을 취소한다. 이벤트별로 나눠서, 직접 실행(full)이 push의 unit을 취소하지 않게 한다
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1단계: 단위 테스트만. MySQL·Docker 없이 몇 분 안에 끝난다. 브랜치 보호의 필수 검사 이름이 이 job 이름(unit)이다
  unit:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 단위 테스트
        run: ./gradlew unitTest jacocoUnitTestReport --no-daemon 2>&1 | tee gradle-unit.log

      - name: 실패 내용 표시 (실패했을 때)
        if: failure()
        run: python3 scripts/ci-test-annotation.py build/test-results/unitTest gradle-unit.log

      - name: 테스트 보고서 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: build/reports/tests/unitTest
          retention-days: 7

      - name: 단위 테스트 커버리지 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: build/reports/jacoco/jacocoUnitTestReport/html
          retention-days: 7
          if-no-files-found: ignore

  # 2단계: 합칠 때의 전체 확인. 배포 전에 꼭 필요한 비싼 검사는 여기서만 돈다
  full:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: one_blog_test
          MYSQL_USER: one_blog
          MYSQL_PASSWORD: one_blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SMOKE_ENV: >-
        DB_HOST=127.0.0.1 DB_PORT=3306 DB_USERNAME=root DB_PASSWORD=root
        JWT_SECRET=ci-only-jwt-secret-0123456789abcdef0123456789abcdef
        CODE_PEPPER=ci-only-code-pepper MAIL_MODE=log COOKIE_SECURE=false
        ADMIN_LOGIN_ID=ciadmin ADMIN_PASSWORD=ci-only-admin-password
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube가 줄마다 언제 바뀌었는지(git blame)로 "새 코드"를 가린다. 얕은 복제면 판단이 틀린다
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 전체 테스트
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USERNAME: one_blog
          TEST_DB_PASSWORD: one_blog
        run: ./gradlew test --no-daemon 2>&1 | tee gradle-test.log

      # 실패한 테스트·컴파일 오류를 실행 화면의 Annotations에 띄운다(로그·보고서를 받지 못하는 곳에서도 이유가 보이게)
      - name: 실패 내용 표시 (실패했을 때)
        if: failure()
        run: python3 scripts/ci-test-annotation.py build/test-results/test gradle-test.log

      - name: 테스트 보고서 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      # E2E (US5): 테스트가 서버를 무작위 포트로 띄우고 Chromium(화면 없음)이 가입·글·참여·사진·계정 흐름을 눌러 본다
      - name: E2E 테스트
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USERNAME: one_blog
          TEST_DB_PASSWORD: one_blog
        run: ./gradlew playwrightInstall e2eTest --no-daemon 2>&1 | tee gradle-e2e.log

      - name: E2E 실패 내용 표시 (실패했을 때)
        if: failure()
        run: python3 scripts/ci-test-annotation.py build/test-results/e2eTest gradle-e2e.log

      # 흐름마다 마지막 화면 캡처(.png)와 trace(.zip). trace는 https://trace.playwright.dev 에 끌어다 놓으면 누른 순서대로 다시 볼 수 있다
      - name: E2E 화면 기록 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            build/e2e-artifacts
            build/reports/tests/e2eTest
          retention-days: 7
          if-no-files-found: ignore

      - name: 커버리지 보고서 (전체 테스트 + E2E)
        # -x test: 앞 단계에서 이미 돌았다(테스트를 다시 돌리지 않고 기록만 모은다)
        run: ./gradlew jacocoTestReport -x test --no-daemon

      # SonarQube (merge 뒤 develop·main push에서만). 서버가 닿는지 먼저 본다: 안 닿으면 분석 오류 대신 이유를 바로 알린다
      - name: SonarQube 서버 연결 확인
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SonarQube 설정 없음::GitHub Secrets에 SONAR_HOST_URL과 SONAR_TOKEN을 넣어 주세요 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          STATUS="$(curl -sS -m 20 "${SONAR_HOST_URL%/}/api/system/status" || true)"
          echo "서버 상태: $STATUS"
          case "$STATUS" in
            *'"status":"UP"'*) ;;
            *) echo "::error title=SonarQube 서버::서버에 닿지 않거나 준비되지 않았습니다 (SONAR_HOST_URL, 서버 상태 확인). 서버가 돌아오면 이 실행을 다시 돌려 주세요"; exit 1 ;;
          esac

      - name: SonarQube 분석·품질 게이트
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if ! ./gradlew sonar -x test -x e2eTest --no-daemon; then
            echo "::error title=품질 게이트::SonarQube 분석이 실패했거나 품질 게이트를 통과하지 못했습니다. 서버의 one-blog 프로젝트에서 새 이슈를 보고, 새 feature 브랜치에서 고쳐 다시 merge해 주세요. 통과 전에는 버전을 올려 배포하지 않습니다"
            exit 1
          fi

      - name: 배포용 jar 만들기
        run: ./gradlew bootJar --no-daemon && ls -l build/libs

      - name: jar 실행 확인 (빈 DB에서 시작)
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE one_blog_smoke CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          env $SMOKE_ENV DB_NAME=one_blog_smoke java -jar build/libs/one-blog.jar > smoke-jar.log 2>&1 &
          APP=$!
          ./scripts/smoke-check.sh http://127.0.0.1:8080 || { cat smoke-jar.log; ./scripts/ci-log-annotation.sh jar-start smoke-jar.log; exit 1; }
          kill $APP; wait $APP || true
          grep -q "Graceful shutdown" smoke-jar.log && echo "정상 종료 확인" || { tail -50 smoke-jar.log; ./scripts/ci-log-annotation.sh jar-shutdown smoke-jar.log; echo "정상 종료 로그가 없습니다"; exit 1; }

      - name: Docker 이미지 만들기
        run: docker build -t one-blog:ci .

      - name: Docker 실행 확인
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE one_blog_docker CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          docker run -d --name one-blog --network host $(for v in $SMOKE_ENV; do printf -- '-e %s ' "$v"; done) -e DB_NAME=one_blog_docker -e PORT=8081 one-blog:ci
          ./scripts/smoke-check.sh http://127.0.0.1:8081 || { docker logs one-blog; docker logs one-blog 2>&1 | ./scripts/ci-log-annotation.sh docker-start -; exit 1; }
          docker stop -t 30 one-blog

      - name: jar 올리기
        uses: actions/upload-artifact@v7
        with:
          name: one-blog-jar
          path: build/libs/one-blog.jar
          retention-days: 14
