# 자동 배포 (D-118, D-120): 버전을 올렸을 때만 배포한다.
# main에 push(또는 PR merge) → CI 성공 → build.gradle.kts의 version(예: 0.2.0)에 해당하는 태그 v0.2.0이
# 아직 없으면 배포하고, 배포가 성공하면 그 커밋에 태그 v0.2.0을 붙인다. 버전이 그대로면 CI만 돌고 배포하지 않는다.
# 수동 실행(Actions → Deploy → Run workflow)은 버전과 상관없이 지금 main을 다시 배포한다(시크릿을 바꿨을 때 등).
# 1) Docker 이미지를 만든다 (태그 = 버전-커밋 앞 7자리)
# 2) 이미지, 배포 스크립트(scripts/deploy.sh), 환경변수 파일(deploy.env)을 SSH로 서버의 ~/one-blog/ 에 올린다
# 3) 서버에서 deploy.sh를 실행한다: 8430 포트로 새 컨테이너 실행 → /api/health 확인 → 실패하면 바로 전 버전으로 되돌림
# 필요한 GitHub Secrets
#   SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD        서버 접속
#   DB_ADDRESS, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD  운영 DB
#   (선택) MAIL_USERNAME, MAIL_PASSWORD   넣으면 인증 메일을 실제로 보냄. 없으면 인증번호가 서버 로그에 찍힘
#   (선택) ADMIN_LOGIN_ID, ADMIN_PASSWORD 넣으면 처음 시작할 때 관리자 계정을 만듦
#   (선택) COOKIE_SECURE                  HTTPS를 붙인 뒤 true. 없으면 false(http에서 로그인되도록)
#   (선택) PUBLIC_BASE_URL                SNS 미리보기에 쓸 사이트 주소
#   (선택) CODE_PEPPER, PRIVACY_HASH_PEPPER, JWT_SECRET
#          넣으면 서버의 ~/one-blog/secrets.env 값 대신 이 값을 쓴다. 로컬과 같은 DB를 쓰는 동안에는
#          CODE_PEPPER(와 PRIVACY_HASH_PEPPER)를 로컬 .env와 같게 둬야 블랙리스트 해시가 맞는다
# 넣지 않으면 JWT_SECRET, CODE_PEPPER는 서버에서 처음 배포할 때 만들어 ~/one-blog/secrets.env에 두고 계속 쓴다.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나씩. 진행 중인 배포를 끊지 않고 다음 배포가 기다린다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # 배포 성공 후 버전 태그를 붙이기 위해

jobs:
  version:
    # main push로 돈 CI가 성공했을 때만 (PR의 CI는 제외). 수동 실행(workflow_dispatch)은 언제나
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 버전 확인
        id: check
        run: |
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' build.gradle.kts)"
          [ -n "$VERSION" ] || { echo "::error::build.gradle.kts에서 version을 읽지 못했습니다."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "v$VERSION 태그가 이미 있지만 수동 실행이라 다시 배포합니다."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=배포 안 함::버전이 $VERSION 그대로입니다 (v$VERSION 태그가 이미 있음). 배포하려면 build.gradle.kts의 version을 올리세요."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "새 버전 $VERSION: 배포합니다."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: version
    if: needs.version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      REMOTE_DIR: one-blog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: 이미지 태그
        run: echo "TAG=$VERSION-${SHA::7}" >> "$GITHUB_ENV"

      - name: Docker 이미지 만들기
        run: |
          docker build -t "one-blog:$TAG" .
          docker save "one-blog:$TAG" | gzip > one-blog-image.tar.gz
          ls -lh one-blog-image.tar.gz

      - name: 환경변수 파일 만들기 (Secrets → deploy.env)
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_LOGIN_ID: ${{ secrets.ADMIN_LOGIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
          PRIVACY_HASH_PEPPER: ${{ secrets.PRIVACY_HASH_PEPPER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          for name in DB_ADDRESS DB_PORT DB_NAME DB_USERNAME DB_PASSWORD; do
            [ -n "${!name}" ] || { echo "GitHub Secret $name 가 비어 있습니다."; exit 1; }
          done
          umask 077
          {
            echo "DB_HOST=$DB_ADDRESS"
            echo "DB_PORT=$DB_PORT"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "COOKIE_SECURE=${COOKIE_SECURE:-false}"
            if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
              echo "MAIL_MODE=smtp"
              echo "MAIL_USERNAME=$MAIL_USERNAME"
              echo "MAIL_PASSWORD=$MAIL_PASSWORD"
            else
              echo "MAIL_MODE=log"
            fi
            if [ -n "$ADMIN_LOGIN_ID" ] && [ -n "$ADMIN_PASSWORD" ]; then
              echo "ADMIN_LOGIN_ID=$ADMIN_LOGIN_ID"
              echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            fi
            if [ -n "$PUBLIC_BASE_URL" ]; then
              echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL"
            fi
            # 있으면 서버 secrets.env보다 우선 (deploy.env를 나중에 읽음)
            for name in CODE_PEPPER PRIVACY_HASH_PEPPER JWT_SECRET; do
              if [ -n "${!name}" ]; then
                echo "$name=${!name}"
              fi
            done
          } > deploy.env

      - name: 서버에 올리고 실행
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_ID: ${{ secrets.SSH_ID }}
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          OPTS=(-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=20)
          TARGET="$SSH_ID@$SSH_ADDRESS"
          # 접속 단계의 실패 이유를 오류 요약에 남긴다 (sshpass 종료 코드: 5 비밀번호, 6 호스트 키, 255 접속)
          explain() {
            case "$1" in
              5) echo "::error title=SSH 접속 실패::비밀번호가 틀렸습니다 (SSH_ID, SSH_PASSWORD 확인)" ;;
              6) echo "::error title=SSH 접속 실패::서버 호스트 키 확인 실패" ;;
              255) echo "::error title=SSH 접속 실패::서버에 접속하지 못했습니다 (SSH_ADDRESS, SSH_PORT, 방화벽 확인)" ;;
            esac
            exit "$1"
          }
          sshpass -e ssh "${OPTS[@]}" -p "${SSH_PORT:-22}" "$TARGET" "mkdir -p $REMOTE_DIR && chmod 700 $REMOTE_DIR" || explain $?
          sshpass -e scp "${OPTS[@]}" -P "${SSH_PORT:-22}" one-blog-image.tar.gz deploy.env scripts/deploy.sh "$TARGET:$REMOTE_DIR/" || explain $?
          sshpass -e ssh "${OPTS[@]}" -p "${SSH_PORT:-22}" "$TARGET" "bash $REMOTE_DIR/deploy.sh $TAG" || explain $?

      - name: 환경변수 파일 지우기
        if: always()
        run: rm -f deploy.env

      - name: 버전 태그 붙이기
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION 태그가 이미 있습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$SHA" -m "One Blog $VERSION"
          if ! OUT="$(git push origin "v$VERSION" 2>&1)"; then
            echo "::error title=태그 push 실패::$(echo "$OUT" | tr '\n' ' ' | cut -c1-500)"
            exit 1
          fi
          echo "::notice title=배포 완료::One Blog $VERSION을 배포하고 v$VERSION 태그를 붙였습니다."

